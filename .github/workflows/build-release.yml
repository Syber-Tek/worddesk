name: Build and Release WorshipDesk Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
  # Verify on the pull request rather than on the merge. A main-push trigger ran
  # a second full four-platform build for every release, because `npm run
  # release` pushes the version commit and the tag as one operation.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v1.2.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x64
            builder_args: --win --x64
            # Only the platform that produces a manifest publishes it. Every
            # matrix job writes builder-debug.yml and both macOS jobs write
            # latest-mac.yml, so globbing release/*.yml collected several files
            # with the same basename and the release action 404'd trying to
            # replace one it had just uploaded.
            meta: release/latest.yml
          # Apple Silicon. macos-latest is an arm64 runner.
          - os: macos-latest
            name: macOS Apple Silicon (arm64)
            builder_args: --mac --arm64
            meta: release/latest-mac.yml
          # Intel. macos-latest alone produced an arm64-only app, which macOS
          # refuses to open on an Intel Mac ("not supported on this Mac").
          - os: macos-latest
            name: macOS Intel (x64)
            builder_args: --mac --x64
            # The arm64 job above already publishes latest-mac.yml.
            meta: ''
          - os: ubuntu-latest
            name: Linux x64
            builder_args: --linux
            meta: release/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfakeroot rpm dpkg build-essential

      - name: Install Dependencies
        run: npm ci

      # Build and package are separate so the architecture flags reach
      # electron-builder rather than being appended to electron-vite build.
      - name: Build Sources
        run: npm run build

      - name: Package and Create Executables
        run: npx electron-builder --publish never ${{ matrix.builder_args }}

      - name: Upload Build Artifacts
        # Only release runs need these. The release job downloads them to attach
        # to the GitHub release; a pull_request run exists purely to prove the
        # build still compiles, so uploading there would burn storage quota and
        # minutes for artifacts nobody downloads.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: worshipdesk-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            # macOS auto-update installs from a zip, so the zip target has to be
            # published. Without this the .zip.blockmap files get published with
            # no .zip beside them and the macOS manifest points at nothing.
            release/*.zip
            release/*.blockmap
            # The one update manifest this platform owns. Empty for the Intel
            # macOS job, whose manifest is published by the arm64 job.
            #
            # This has to be a glob line inside the one upload step:
            # upload-artifact@v4 artifacts are immutable, so a second step
            # reusing this artifact name is a 409 Conflict.
            ${{ matrix.meta }}
          if-no-files-found: warn
          # A bad release is debugged within days, not months, and every retained
          # artifact counts against the repository's storage allowance.
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    # Publishing is deliberately tag-only. A main-branch push still runs the
    # build job above (so breakage is caught), but it must never create a
    # release: that is what used to publish 1.1.0 artifacts under a v1.0.0 tag
    # and leave two conflicting releases on the public feed.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update GitHub Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Syber-Tek/worshipdesk-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            # macOS update payload. Its .zip.blockmap is already picked up below,
            # so without this the blockmap ships with no zip beside it.
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            # One glob per manifest, each with exactly one producer. A broad
            # artifacts/**/*.yml matched builder-debug.yml from all four matrix
            # jobs, and the duplicate basenames broke the upload.
            artifacts/**/latest.yml
            artifacts/**/latest-mac.yml
            artifacts/**/latest-linux.yml
          name: WorshipDesk Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          body: |
            ## 🚀 WorshipDesk Official Release

            Download standalone offline setup installers:
            - 🪟 **Windows**: `.exe` Installer
            - 🍎 **macOS Apple Silicon** (M1/M2/M3/M4): `.dmg` ending in `-arm64.dmg`
            - 🍎 **macOS Intel** (older Macs): `.dmg` ending in `-x64.dmg`
            - 🐧 **Linux**: `.AppImage` Universal Package (Supports all Linux distros)

            > **Not sure which macOS build to download?**
            > Click the  (Apple menu) → **About This Mac**.
            > "Apple M1/M2/M3/M4" means Apple Silicon (`-arm64.dmg`);
            > "Intel" means an older Mac (`-x64.dmg`).
            > Downloading the wrong one shows the warning
            > "WorshipDesk is not supported on this Mac".

            > **macOS: "app is damaged" or "cannot be opened"?**
            > These builds are not code-signed or notarised, so Gatekeeper blocks
            > them on first open. Open the folder containing the app, right-click
            > (or Control-click) **WorshipDesk.app** → **Open** → **Open** in the
            > dialog. It will then open normally every time.
          draft: false
          prerelease: false
          overwrite: true

      - name: Trigger Website Live Revalidation
        continue-on-error: true
        run: |
          curl -s -X POST "https://worddesk.org/api/revalidate?secret=${{ secrets.REVALIDATE_SECRET }}" || true